<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wang | Travel Links</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <style>
        body { background-color: #FAFAF9; }
        .ins-shadow { box-shadow: 0 4px 15px -2px rgba(0, 0, 0, 0.06); }
        .btn-shadow:active { transform: scale(0.96); }
    </style>
</head>
<body class="text-neutral-800 antialiased font-sans min-h-screen">

    <!-- 提示訊息 -->
    <div id="toast" class="fixed top-6 left-1/2 -translate-x-1/2 z-50 bg-neutral-900 text-white text-[11px] tracking-widest px-6 py-3 rounded-full shadow-xl opacity-0 pointer-events-none transition-all duration-300 flex items-center space-x-2">
        <i data-lucide="check" class="w-3 h-3"></i>
        <span id="toast-text">已複製</span>
    </div>

    <main class="w-full max-w-[360px] mx-auto px-5 pt-12 pb-16 flex flex-col">
        <div class="flex flex-col items-center text-center mb-8">
            <h1 class="font-serif text-3xl font-normal tracking-widest text-neutral-800 mb-2">Wang</h1>
            <p class="text-neutral-400 text-[11px] tracking-[0.2em] uppercase font-light">Let's travel</p>
        </div>

        <div class="mb-8 bg-neutral-200/50 p-1 rounded-2xl flex relative border border-neutral-200/30">
            <div id="tab-indicator" class="absolute top-1 bottom-1 left-1 w-[calc(50%-4px)] bg-white rounded-xl shadow-sm transition-transform duration-300 ease-out"></div>
            <button onclick="switchTab('trip')" id="btn-trip" class="relative z-10 flex-1 py-2.5 text-[11px] tracking-widest font-medium text-neutral-800">TRIP.com</button>
            <button onclick="switchTab('kkday')" id="btn-kkday" class="relative z-10 flex-1 py-2.5 text-[11px] tracking-widest font-medium text-neutral-400">KKDAY</button>
        </div>

        <div class="flex-grow">
            <!-- TRIP.com 區塊 -->
            <div id="trip-links" class="space-y-6 animate-in fade-in duration-500">
                <div onclick="copyPromoCode('mood6off')" class="cursor-pointer bg-blue-600 text-white rounded-2xl p-4 flex items-center shadow-lg hover:bg-blue-700 transition-colors btn-shadow">
                    <div class="w-10 h-10 flex items-center justify-center bg-white/20 rounded-full mr-4">
                        <i data-lucide="ticket" class="w-5 h-5"></i>
                    </div>
                    <div class="flex flex-col text-left">
                        <span class="text-[10px] font-medium opacity-90">TRIP 門票 6% OFF</span>
                        <span class="text-lg font-bold tracking-widest">mood6off</span>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <a href="https://www.trip.com/t/HvocVtGNlU2" target="_blank" class="flex flex-col items-center p-5 bg-white border border-neutral-100 rounded-3xl ins-shadow btn-shadow">
                        <div class="w-10 h-10 rounded-full bg-amber-50 flex items-center justify-center mb-3"><i data-lucide="plane" class="w-5 h-5 text-amber-600"></i></div>
                        <span class="text-[11px] font-medium tracking-widest">機票</span>
                    </a>
                    <a href="https://www.trip.com/t/4ocjyWJNlU2" target="_blank" class="flex flex-col items-center p-5 bg-white border border-neutral-100 rounded-3xl ins-shadow btn-shadow">
                        <div class="w-10 h-10 rounded-full bg-blue-50 flex items-center justify-center mb-3"><i data-lucide="hotel" class="w-5 h-5 text-blue-600"></i></div>
                        <span class="text-[11px] font-medium tracking-widest">住宿</span>
                    </a>
                    <a href="https://www.trip.com/t/vL1YKLKNlU2" target="_blank" class="flex flex-col items-center p-5 bg-white border border-neutral-100 rounded-3xl ins-shadow btn-shadow">
                        <div class="w-10 h-10 rounded-full bg-emerald-50 flex items-center justify-center mb-3"><i data-lucide="ticket" class="w-5 h-5 text-emerald-600"></i></div>
                        <span class="text-[11px] font-medium tracking-widest">門票</span>
                    </a>
                    <a href="https://www.trip.com/t/vL1YKLKNlU2" target="_blank" class="flex flex-col items-center p-5 bg-white border border-neutral-100 rounded-3xl ins-shadow btn-shadow">
                        <div class="w-10 h-10 rounded-full bg-orange-50 flex items-center justify-center mb-3"><i data-lucide="map" class="w-5 h-5 text-orange-600"></i></div>
                        <span class="text-[11px] font-medium tracking-widest">一日遊</span>
                    </a>
                    <a href="https://www.trip.com/t/l1yxAQRNlU2" target="_blank" class="flex flex-col items-center p-5 bg-white border border-neutral-100 rounded-3xl ins-shadow btn-shadow">
                        <div class="w-10 h-10 rounded-full bg-purple-50 flex items-center justify-center mb-3"><i data-lucide="wifi" class="w-5 h-5 text-purple-600"></i></div>
                        <span class="text-[11px] font-medium tracking-widest">ESIM</span>
                    </a>
                    <a href="https://www.trip.com/t/KoYh0vcNlU2" target="_blank" class="flex flex-col items-center p-5 bg-white border border-neutral-100 rounded-3xl ins-shadow btn-shadow">
                        <div class="w-10 h-10 rounded-full bg-cyan-50 flex items-center justify-center mb-3"><i data-lucide="train-front" class="w-5 h-5 text-cyan-600"></i></div>
                        <span class="text-[11px] font-medium tracking-widest">交通查詢</span>
                    </a>
                </div>
            </div>

            <!-- KKDAY 區塊 -->
            <div id="kkday-links" class="space-y-6 hidden animate-in fade-in duration-500">
                <div onclick="copyPromoCode('KKMOOD94')" class="cursor-pointer bg-sky-400 text-white rounded-2xl p-4 flex items-center shadow-lg hover:bg-sky-500 transition-colors btn-shadow">
                    <div class="w-10 h-10 flex items-center justify-center bg-white/20 rounded-full mr-4">
                        <i data-lucide="ticket" class="w-5 h-5"></i>
                    </div>
                    <div class="flex flex-col text-left">
                        <span class="text-[10px] font-medium opacity-90">KKday 滿1500享94折</span>
                        <span class="text-lg font-bold tracking-widest">KKMOOD94</span>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <a href="https://www.kkday.com/zh-tw/product/productlist?cid=22347" target="_blank" class="flex flex-col items-center p-5 bg-white border border-neutral-100 rounded-3xl ins-shadow btn-shadow">
                        <div class="w-10 h-10 rounded-full bg-rose-50 flex items-center justify-center mb-3"><i data-lucide="sparkles" class="w-5 h-5 text-rose-600"></i></div>
                        <span class="text-[11px] font-medium tracking-widest">機票</span>
                    </a>
                    <a href="https://www.kkday.com/zh-tw/product/productlist?cid=22347" target="_blank" class="flex flex-col items-center p-5 bg-white border border-neutral-100 rounded-3xl ins-shadow btn-shadow">
                        <div class="w-10 h-10 rounded-full bg-amber-50 flex items-center justify-center mb-3"><i data-lucide="bed-double" class="w-5 h-5 text-amber-600"></i></div>
                        <span class="text-[11px] font-medium tracking-widest">機+酒</span>
                    </a>
                    <a href="https://www.kkday.com/zh-tw/category/global/attraction-tickets/?cid=22347" target="_blank" class="flex flex-col items-center p-5 bg-white border border-neutral-100 rounded-3xl ins-shadow btn-shadow">
                        <div class="w-10 h-10 rounded-full bg-emerald-50 flex items-center justify-center mb-3"><i data-lucide="ticket" class="w-5 h-5 text-emerald-600"></i></div>
                        <span class="text-[11px] font-medium tracking-widest">門票</span>
                    </a>
                    <a href="https://www.kkday.com/zh-tw/category/global/experiences/?cid=22347" target="_blank" class="flex flex-col items-center p-5 bg-white border border-neutral-100 rounded-3xl ins-shadow btn-shadow">
                        <div class="w-10 h-10 rounded-full bg-orange-50 flex items-center justify-center mb-3"><i data-lucide="map-pin" class="w-5 h-5 text-orange-600"></i></div>
                        <span class="text-[11px] font-medium tracking-widest">一日遊</span>
                    </a>
                    <a href="https://www.kkday.com/zh-tw/portable-travel-wifi-sim-card?cid=22347" target="_blank" class="flex flex-col items-center p-5 bg-white border border-neutral-100 rounded-3xl ins-shadow btn-shadow">
                        <div class="w-10 h-10 rounded-full bg-purple-50 flex items-center justify-center mb-3"><i data-lucide="wifi" class="w-5 h-5 text-purple-600"></i></div>
                        <span class="text-[11px] font-medium tracking-widest">ESIM</span>
                    </a>
                    <a href="https://www.kkday.com/zh-tw/category/global/transport/?cid=22347" target="_blank" class="flex flex-col items-center p-5 bg-white border border-neutral-100 rounded-3xl ins-shadow btn-shadow">
                        <div class="w-10 h-10 rounded-full bg-cyan-50 flex items-center justify-center mb-3"><i data-lucide="car" class="w-5 h-5 text-cyan-600"></i></div>
                        <span class="text-[11px] font-medium tracking-widest">交通</span>
                    </a>
                </div>
            </div>
        </div>
    </main>

    <script>
        window.onload = () => lucide.createIcons();
        function switchTab(tab) {
            const isTrip = tab === 'trip';
            document.getElementById('tab-indicator').style.transform = isTrip ? 'translateX(0)' : 'translateX(100%)';
            document.getElementById('trip-links').classList.toggle('hidden', !isTrip);
            document.getElementById('kkday-links').classList.toggle('hidden', isTrip);
            document.getElementById('btn-trip').classList.toggle('text-neutral-800', isTrip);
            document.getElementById('btn-trip').classList.toggle('text-neutral-400', !isTrip);
            document.getElementById('btn-kkday').classList.toggle('text-neutral-800', !isTrip);
            document.getElementById('btn-kkday').classList.toggle('text-neutral-400', isTrip);
        }
        function copyPromoCode(code) {
            navigator.clipboard.writeText(code);
            const toast = document.getElementById('toast');
            document.getElementById('toast-text').textContent = `已複製優惠碼: ${code}`;
            toast.classList.replace('opacity-0', 'opacity-100');
            setTimeout(() => toast.classList.replace('opacity-100', 'opacity-0'), 2000);
        }
    </script>
</body>
</html>
